<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteTaking App</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!--Header-->
    <header>
        <div class="logo">
            <h2>NoteApp</h2>
        </div>
        <div class="search">
            <input type="text" id="srh" placeholder="Search a Note">
        </div>
    </header>
    <!--container-->
    <div class="container" id="con-body">
        <!--Input-->
        <div class="inp-frm">
             <form action="" id="add-frm">
                <h3>Add a Note</h3>
                <input type="text" id="n-title" placeholder="Title..">
                <textarea name="" id="n-body"placeholder='Note body...'></textarea>
                <button type="submit"id='save'>Save</button>
                <button type="reset" id="reset">Reset</button>
             </form>
        </div>
       
    </div>
    
</body>
</html>
